spring:
  application:
    name: bpr-backend

  # 민감 정보는 application-secret.yml에서 관리
  profiles:
    include: secret

  # Jackson 날짜 직렬화 설정
  # LocalDate를 [2025,2,22] 배열 대신 "2025-02-22" ISO 문자열로 반환
  jackson:
    serialization:
      write-dates-as-timestamps: false

  # JPA 설정
  jpa:
    hibernate:
      ddl-auto: update       # 개발 중: update / 운영: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQL8Dialect

  # 파일 업로드 제한 (현장 사진 첨부용)
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 30MB

# 서버 포트
server:
  port: 8080
  # Java 21 Virtual Threads 활성화
  tomcat:
    threads:
      max: 200

  # Virtual Threads 활성화 (Java 21)
  threads:
    virtual:
      enabled: true

# 로깅
logging:
  level:
    com.bpr: DEBUG
    org.springframework.security: DEBUG
